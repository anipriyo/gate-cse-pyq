<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GATE CSE PYQ Practice</title>
  <meta name="description" content="Practise GATE CSE previous-year questions (2018 onwards) subject-wise, topic-wise, or as full GATE-style mock tests.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='32' y='43' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>G</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/exam.css">
  <script>
    // apply saved theme before paint
    try { const t = localStorage.getItem("gatepyq.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <a href="#/" class="brand"><span class="logo">G</span><span>GATE CSE <b>PYQ</b></span></a>
    <nav class="nav">
      <a href="#/practice" data-nav="practice">Practice</a>
      <a href="#/mock" data-nav="mock">Mock tests</a>
      <a href="#/history" data-nav="history">Progress</a>
    </nav>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
  </header>
  <main id="app"><div class="loading">Loading questions…</div></main>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
